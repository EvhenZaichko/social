<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-tmp</title>
    <style>
      html, body {
        margin: 0;
        background-color: #0f1114;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #boot > div {
        width: 2rem;
        height: 2rem;
        border-radius: 9999px;
        border: 4px solid #2f3336;
        border-top-color: #ffffff;
        animation: boot-spin .8s linear infinite,
                   boot-fade .2s ease-out .3s both;
      }

      @keyframes boot-spin { to { transform: rotate(360deg) } }
      @keyframes boot-fade { from { opacity: 0 } to { opacity: 1 } }

      @media (prefers-reduced-motion: reduce) {
        #boot > div { animation: boot-fade .2s ease-out .3s both }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><div></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
